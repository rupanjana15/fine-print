# Data pipeline settings. Bump `version` whenever processed data changes.
version: "ds-v1"  # v0.2 build: windows + negatives filtered by similarity (D31)

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  predictions: data/predictions   # model outputs per eval set (contain ToS text, so not in git)
  models: data/models             # downloaded GGUF / baseline models

tosdr:
  base_url: https://api.tosdr.org
  # Headers say 5 requests / 5 s, but bursts still get HTTP 429 ("You are doing this too much").
  seconds_between_requests: 2.0
  max_retries: 8
  backoff_base_seconds: 30        # 30, 60, 120 ... capped at max_backoff_seconds
  max_backoff_seconds: 600
  user_agent: fine-print-research/0.1
  # There is no public case-list endpoint, so we scan case ids. Real ids start around 120
  # (ids 1-60+ are empty) and go past 500, so the scan must tolerate long gaps.
  max_case_id: 1500
  stop_after_empty_cases: 300     # stop after this many consecutive empty ids

lexglue:
  hf_name: coastalcph/lex_glue
  config: unfair_tos

chunking:
  target_tokens: 200
  overlap_tokens: 30

split:
  by: service            # never random — see docs/ARCHITECTURE.md §7
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

negatives:
  target_fraction: 0.55  # share of examples with {"flags": []} (an upper bound: see D31)
  max_quote_similarity: 0.6  # drop negatives with a sentence this close (TF-IDF cosine) to a known risky quote (D31)

hf_dataset_repo: null    # e.g. <your-hf-username>/fine-print-data (private)
