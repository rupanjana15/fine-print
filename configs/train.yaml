# QLoRA fine-tuning settings, read by notebooks/train_kaggle.ipynb.
base_model: unsloth/Qwen2.5-3B-Instruct
alt_base_model: unsloth/Llama-3.2-3B-Instruct

load_in_4bit: true
max_seq_length: 1024

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  learning_rate: 2.0e-4
  num_epochs: 2
  per_device_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch 16
  lr_scheduler: cosine
  warmup_ratio: 0.03
  completion_only_loss: true
  save_steps: 200
  seed: 42

hf_model_repo: null   # e.g. <your-hf-username>/fine-print-3b (private)
