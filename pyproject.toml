[project]
name = "fineprint"
version = "0.0.0"
description = "Fine-tuned 3B LLM that flags risky clauses in Terms of Service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "datasets>=3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Installed later, when each milestone needs it.
app = ["gradio>=5", "llama-cpp-python>=0.3"]
# Running the base / fine-tuned GGUF model on the Mac for evaluation (v0.3+).
eval = ["llama-cpp-python>=0.3", "huggingface-hub>=0.26"]
# B3 DeBERTa baseline (runs on the Mac's GPU via mps, or on Kaggle).
deberta = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=5"]
# Training runs on Kaggle; these are installed there, not on the Mac.
train = ["unsloth", "trl", "peft", "transformers", "accelerate", "bitsandbytes"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fineprint"]

[tool.ruff]
line-length = 100
